services:
  api-dev:
    profiles: ["dev"]
    build:
      context: .
      additional_contexts:
        data: ${QURANAI_DATA_HOST_DIR:-./src/quranai/data}
      args:
        QURANAI_DATA_DIR: ${QURANAI_CONTAINER_DATA_DIR:-/app/data}
    env_file:
      - .env
    environment:
      - QURANAI_DATA_DIR=${QURANAI_CONTAINER_DATA_DIR:-/app/data}
    ports:
      - "${QURANAI_API_PORT:-7990}:${QURANAI_API_PORT:-7990}"
    command: >
      sh -c "uv run adk api_server src/quranai/agents/ --host 0.0.0.0 --port $QURANAI_API_PORT --allow_origins '*'"
    restart: unless-stopped

  api-prod:
    profiles: ["prod"]
    build:
      context: .
      additional_contexts:
        data: ${QURANAI_DATA_HOST_DIR:-./src/quranai/data}
      args:
        QURANAI_DATA_DIR: ${QURANAI_CONTAINER_DATA_DIR:-/app/data}
    env_file:
      - .env
    environment:
      - QURANAI_DATA_DIR=${QURANAI_CONTAINER_DATA_DIR:-/app/data}
    ports:
      - "${QURANAI_API_PORT:-7990}:${QURANAI_API_PORT:-7990}"
    command: >
      sh -c "uv run adk api_server src/quranai/agents/ --host 0.0.0.0 --port $QURANAI_API_PORT --allow_origins '*'"
    restart: unless-stopped
